spring:
  application:
    name: railway-dislocation
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/alis}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    clear-checksums: true

server:
  port: ${SERVER_PORT:8090}
  servlet:
    context-path: /api

springdoc:
  swagger-ui:
    path: /swagger-ui.html

webhook:
  secret: ${WEBHOOK_SECRET:}

# Авто-архивация вагонов без операций дольше порога
archive:
  stale-days: ${ARCHIVE_STALE_DAYS:30}
  interval-ms: ${ARCHIVE_INTERVAL_MS:21600000}   # частота проверки (6 часов)
  initial-delay-ms: ${ARCHIVE_INITIAL_DELAY_MS:120000}

jwt:
  secret: ${JWT_SECRET:disabled_auth_placeholder_secret_32ch}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
