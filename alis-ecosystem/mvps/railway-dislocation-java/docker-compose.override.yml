services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: dislocation
      POSTGRES_USER: dislocation
      POSTGRES_PASSWORD: dislocation
    ports:
      - "5432:5432"

  backend:
    depends_on:
      - postgres
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/dislocation
      DATABASE_USERNAME: dislocation
      DATABASE_PASSWORD: dislocation
      WEBHOOK_SECRET: ""
