services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: logistics_v2_backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-disabled_auth_placeholder_secret_32ch}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      SERVER_PORT: 8090
    restart: unless-stopped
    networks:
      - proxy
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: logistics_v2_frontend
    expose:
      - 80
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - proxy
      - internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  proxy:
    external: true
  internal:
    driver: bridge
