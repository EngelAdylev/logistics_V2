server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS — lazy resolution so nginx doesn't crash if backend isn't up yet
    resolver 127.0.0.11:53 valid=10s;
    resolver_timeout 5s;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/x-javascript text/xml application/xml;
    gzip_min_length 1024;

    client_max_body_size 100M;

    location /api/ {
        set $backend_upstream backend:8090;
        proxy_pass http://$backend_upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_read_timeout 90;
        proxy_connect_timeout 60;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=3600";
    }
}
